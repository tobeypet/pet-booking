<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛孩預約 | 線上預約系統</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D6FA8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="毛孩預約">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EAF0FA; --cream-2:#DCE6F5; --pine:#3D6FA8; --pine-2:#2A5480;
    --sage:#8FB8E0; --sage-light:#E3EDF9; --apricot:#29B6E8; --apricot-dark:#1D96C2;
    --blush:#B8C5EA; --ink:#1A3A56; --ink-soft:#4A6785; --line:#C7D9EF;
    --white:#FFFFFF; --danger:#C15B4A; --danger-light:#F6E4DF; --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(255,255,255,0.35) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(229,143,87,0.14) 0, transparent 45%);
    color:var(--ink); font-family:"Noto Sans TC", sans-serif;
    min-height:100vh; padding:32px 16px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand-mark{
    width:50px;height:50px;border-radius:50%;background:var(--pine);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 4px 10px rgba(46,104,88,0.3);
  }
  .brand-name{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:800;font-size:23px;color:var(--pine);letter-spacing:0.3px;line-height:1.1;}
  .brand-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:1px;margin-top:2px;}

  .progress{display:flex;justify-content:space-between;margin-bottom:26px;position:relative;padding:0 4px;}
  .progress::before{content:"";position:absolute;top:16px;left:28px;right:28px;height:2px;background:var(--line);z-index:0;}
  .step-dot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;flex:1;}
  .step-dot.clickable{cursor:pointer;}
  .step-num{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--white);border:2px solid var(--line);font-weight:700;font-size:13px;
    color:var(--ink-soft);transition:all .2s ease;
  }
  .step-dot.active .step-num{background:var(--apricot);border-color:var(--apricot-dark);color:#fff;}
  .step-dot.done .step-num{background:var(--pine);border-color:var(--pine);color:#fff;}
  .step-label{font-size:11.5px;color:var(--ink-soft);text-align:center;max-width:64px;line-height:1.3;}
  .step-dot.active .step-label{color:var(--pine);font-weight:700;}

  .bubbles{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:20px;margin:18px 0 8px;opacity:.85;}
  .bubbles span{display:block;border-radius:50%;background:linear-gradient(160deg, var(--sage-light), var(--sage));}
  .bubbles span:nth-child(1){width:6px;height:6px;}
  .bubbles span:nth-child(2){width:10px;height:10px;background:linear-gradient(160deg,#fff,var(--blush));}
  .bubbles span:nth-child(3){width:5px;height:5px;}
  .bubbles span:nth-child(4){width:13px;height:13px;background:linear-gradient(160deg,#fff,var(--apricot));opacity:.5;}
  .bubbles span:nth-child(5){width:7px;height:7px;}
  .pet-strip{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 10px;}
  .pet-strip-icon{width:34px;height:34px;flex-shrink:0;}

  .card{background:var(--white);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 10px 30px rgba(38,67,58,0.08);padding:26px 22px 24px;}
  .card-title{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:700;font-size:20px;color:var(--pine);margin:0 0 4px;}
  .card-desc{font-size:13px;color:var(--ink-soft);margin:0 0 20px;line-height:1.6;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--pine);margin-bottom:6px;}
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-left:4px;}
  input[type=text], input[type=tel], input[type=number], select, textarea{
    width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--cream);font-size:14.5px;font-family:inherit;color:var(--ink);
    outline:none;transition:border-color .15s ease, background .15s ease;resize:vertical;
  }
  textarea{min-height:64px;line-height:1.5;}
  input:focus, select:focus, textarea:focus{border-color:var(--apricot);background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px;}
  .seg button{flex:1;padding:12px 8px;border:none;background:var(--cream);font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s ease;}
  .seg button + button{border-left:1.5px solid var(--line);}
  .seg button.active{background:var(--pine);color:#fff;}

  .photo-upload{display:flex;align-items:center;gap:14px;}
  .photo-preview{width:64px;height:64px;border-radius:14px;background:var(--sage-light);border:1.5px dashed var(--sage);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-preview svg{width:26px;height:26px;opacity:.55;}
  .upload-btn{padding:10px 16px;border-radius:11px;background:var(--cream);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--pine);cursor:pointer;}
  .upload-btn:hover{background:var(--sage-light);}
  input[type=file]{display:none;}

  .section-divider{font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:var(--apricot-dark);margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .svc-card{border:1.5px solid var(--line);border-radius:14px;padding:16px 14px;cursor:pointer;background:var(--cream);transition:all .15s ease;text-align:left;}
  .svc-card:hover{border-color:var(--sage);}
  .svc-card.active{border-color:var(--apricot);background:#E5F8FD;box-shadow:0 0 0 3px rgba(228,148,61,0.15);}
  .svc-icon{display:block;margin-bottom:6px;}
  .svc-icon svg{width:36px;height:36px;}
  .svc-name{font-weight:700;font-size:15px;color:var(--pine);}
  .svc-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .choice-row{display:flex;gap:10px;margin-bottom:16px;}
  .choice-pill{flex:1;padding:12px;border-radius:12px;text-align:center;border:1.5px solid var(--line);background:var(--cream);font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;}
  .choice-pill.icon-pill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;}
  .choice-pill.icon-pill svg{width:42px;height:42px;flex-shrink:0;}
  .choice-pill.active{background:var(--pine);border-color:var(--pine);color:#fff;}

  .duration-box{background:var(--sage-light);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--pine);font-weight:600;margin-top:6px;margin-bottom:20px;}
  .duration-box b{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:16px;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .mo{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:700;font-size:16px;color:var(--pine);}
  .cal-nav button{height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--cream);cursor:pointer;font-size:12.5px;color:var(--pine);padding:0 10px;font-family:inherit;font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid transparent;
    color:var(--ink);background:transparent;gap:1px;position:relative;
    min-width:0;overflow:hidden;
  }
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell.avail{background:#BCCCDC;border-color:#A3B6CA;box-shadow:0 1px 3px rgba(26,58,86,0.06);}
  .cal-cell.disabled{color:#B7C4D6;background:transparent;cursor:not-allowed;}
  .cal-cell.avail:hover{border-color:var(--sage);}
  .cal-cell.selected{background:var(--apricot);border-color:var(--apricot);color:#fff;}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--pine);}
  .cal-cell.extended{background:#D9EAFD;border-color:#B8D4F5;color:var(--ink);}
  .cal-cell.extended.selected{background:var(--apricot);color:#fff;}
  .cal-tag{font-size:8.5px;font-weight:700;line-height:1;background:var(--pine);color:#fff;padding:1.5px 4px;border-radius:5px;letter-spacing:0.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box;}
  .cal-cell.selected .cal-tag{background:#fff;color:var(--pine);}
  .taichung-dot{width:6px;height:6px;border-radius:50%;background:var(--pine);display:inline-block;flex-shrink:0;}
  .cal-cell.selected .taichung-dot{background:#fff;}
  .area-hint{font-size:7.5px;line-height:1;color:var(--ink-soft);opacity:0.75;letter-spacing:0.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);margin:6px 0 18px;flex-wrap:wrap;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.a{background:#BCCCDC;border:1.5px solid #A3B6CA;}
  .dot.d{background:transparent;border:1.5px dashed #B7C4D6;}
  .dot.e{background:#D9EAFD;border:1.5px solid #B8D4F5;}

  .slot-title{font-size:13px;font-weight:700;color:var(--pine);margin:4px 0 10px;}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .slot{padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);text-align:center;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .slot:hover{border-color:var(--sage);}
  .slot.selected{background:var(--pine);border-color:var(--pine);color:#fff;}
  .slot.taken{background:#E4EAF2;color:#9FB0C4;cursor:not-allowed;text-decoration:line-through;}
  .empty-note{font-size:13px;color:var(--ink-soft);background:var(--cream);border-radius:10px;padding:14px;text-align:center;}

  .review-block{background:var(--cream);border-radius:14px;padding:16px;margin-bottom:14px;}
  .review-block h4{margin:0 0 10px;font-size:12.5px;color:var(--apricot-dark);letter-spacing:1px;font-weight:700;}
  .review-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .review-line:last-child{border-bottom:none;}
  .review-line .k{color:var(--ink-soft);flex-shrink:0;}
  .review-line .v{font-weight:600;text-align:right;}
  .review-line .v.multi{white-space:pre-wrap;max-width:70%;}
  .review-photo{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .review-photo img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line);}

  .actions{display:flex;gap:10px;margin-top:22px;}
  .btn{flex:1;padding:13px 18px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .1s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--apricot);color:#fff;}
  .btn-primary:hover{background:var(--apricot-dark);}
  .btn-primary:disabled{background:#D8E2F0;color:#fff;cursor:not-allowed;}
  .btn-ghost{background:var(--cream);color:var(--pine);border:1.5px solid var(--line);flex:0 0 100px;}
  .btn-ghost:hover{background:var(--sage-light);}
  .err{color:var(--danger);font-size:12px;margin-top:5px;}

  .success{text-align:center;padding:10px 6px 4px;}
  .success .paw{width:64px;height:64px;border-radius:50%;background:var(--sage-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .success h2{font-family:"Baloo 2","Noto Sans TC",sans-serif;color:var(--pine);margin:0 0 6px;}
  .success p{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}
  .conf-code{display:inline-block;background:var(--pine);color:#fff;padding:8px 18px;border-radius:10px;font-weight:700;letter-spacing:2px;font-family:"Baloo 2","Noto Sans TC",sans-serif;margin-bottom:14px;}
  .pending-badge{
    display:inline-flex;align-items:center;gap:6px;background:#DFF6FC;color:var(--apricot-dark);
    padding:8px 16px;border-radius:99px;font-size:12.5px;font-weight:700;margin-bottom:18px;
  }
  .code-box{
    background:var(--sage-light);border-radius:14px;padding:16px;margin-bottom:20px;text-align:left;
  }
  .code-box .lbl{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .code-box .code{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:22px;font-weight:900;color:var(--pine);letter-spacing:3px;}
  .code-box .tip{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  .masked-card{background:var(--sage-light);border-radius:14px;padding:16px;margin:16px 0;}
  .masked-card h4{margin:0 0 10px;font-size:12.5px;color:var(--pine);letter-spacing:1px;font-weight:700;}

  .install-banner{
    background:var(--pine);color:#fff;border-radius:14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.5;
  }
  .install-banner b{font-weight:800;}
  .install-banner .btns{display:flex;gap:8px;flex-shrink:0;}
  .install-banner button{border:none;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px;}
  .install-banner .install-go{background:#fff;color:var(--pine);}
  .install-banner .install-close{background:rgba(255,255,255,0.25);color:#fff;padding:7px 10px;}

  @media (max-width:420px){
    .svc-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .slot-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

<script>
/* ================= Google 試算表／日曆 串接設定 ================= */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfwpOEL4l_iqzXx0Ky9_J2l-HzFsHZD-nURQ8VRpGPrs_NYAN6u5RTtVE607RutPH6/exec";

/* ================= state ================= */
const state = {
  mode: 'landing', // 'landing' | 'register' | 'booking'
  step: 1, // 1 選服務時段 2 填寫資料 3 確認預約 4 成功
  landingDate: null,

const BUSINESS_START = 9*60, DEFAULT_BUSINESS_END = 13*60, EXTENDED_BUSINESS_END = 20*60;

/* ================= helpers ================= */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(mins){ const h=Math.floor(mins/60), m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function getBusinessEnd(dateStr){ return availability.extendedDates.has(dateStr) ? EXTENDED_BUSINESS_END : DEFAULT_BUSINESS_END; }
function isPastDate(dt){ const today=new Date(); today.setHours(0,0,0,0); return dt < today; }
function isDateFullyClosed(dateStr){ return availability.closedDates.has(dateStr); }
function isSlotBlocked(dateStr, startMin, durationMin){
  if(isDateFullyClosed(dateStr)) return true;
  const blocked = availability.blockedSlots[dateStr];
  if(!blocked || blocked.size===0) return false;
  for(let t=startMin; t<startMin+durationMin; t+=30){ if(blocked.has(fmtTime(t))) return true; }
  return false;
}
// 依地址文字判斷客人屬於台中還是雙北（台北/新北），都不是的話算「其他地區」
function getAddressRegion(address){
  address = String(address == null ? '' : address);
  if(address.indexOf('台中') !== -1) return 'taichung';
  if(address.indexOf('台北') !== -1 || address.indexOf('新北') !== -1) return 'shuangbei';
  return 'other';
}
// 如果這天是「台中服務日」，時段要看客人屬於台中／雙北，只能選店家在後台為該地區開放的時段；
// 不屬於台中、雙北的客人這天完全不能預約。address 還不知道時（例如還沒填資料）先不擋，等後面步驟知道地址再驗一次。
function isSlotAllowedForRegion(dateStr, startMin, durationMin, address){
  if(!availability.taichungDates.has(dateStr)) return true;
  if(!address) return true;
  const region = getAddressRegion(address);
  if(region === 'other') return false;
  const dayRegions = availability.taichungRegionSlots[dateStr];
  const allowed = dayRegions ? dayRegions[region] : null;
  if(!allowed || allowed.size === 0) return false;
  for(let t=startMin; t<startMin+durationMin; t+=30){ if(!allowed.has(fmtTime(t))) return false; }
  return true;
}
// 用「目前選的服務需要幾分鐘」去掃過當天營業時間，看看還有沒有任何一個起始時間可以完整塞得下
// 如果整天都找不到任何一個空檔，代表這天對這個服務來說已經約滿了，日曆格子應該直接顯示成不可點選
function isDateFullyBookedForDuration(dateStr, durationMin, address){
  if(isDateFullyClosed(dateStr)) return true;
  if(!durationMin) return false;
  const end = getBusinessEnd(dateStr);
  for(let start=BUSINESS_START; start+durationMin<=end; start+=30){
    if(!isSlotBlocked(dateStr, start, durationMin) && isSlotAllowedForRegion(dateStr, start, durationMin, address)) return false;
  }
  return true;
}
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function compressImage(dataUrl, maxSize=1000, quality=0.72){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxSize || height > maxSize){
        if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
        else { width = Math.round(width * maxSize / height); height = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

function extractCityDistrict(address){
  if(!address) return '—';
  const m = address.match(/^(.{2,3}[市縣])(.{1,3}[區市鄉鎮])/);
  return m ? (m[1]+m[2]) : address.slice(0,6);
}
function extractDistrictOnly(address){
  if(!address) return '';
  const m = address.match(/^(.{2,3}[市縣])(.{1,3}[區市鄉鎮])/);
  return m ? m[2] : address.slice(0,4);
}

const SERVICE_DEF = {

function computeDuration(){
  const s = state.service;
  if(!s.category || !s.animalType) return null;
  if(s.animalType==='cat') return SERVICE_DEF[s.category].rules.cat;
  if(s.animalType==='dog'){ if(!s.hairLength) return null; return s.hairLength==='long' ? SERVICE_DEF[s.category].rules.dogLong : SERVICE_DEF[s.category].rules.dogShort; }

}

function render(){
  const card = document.getElementById('card');

    document.getElementById('progress').innerHTML = '';
    card.innerHTML = tplLanding();
    bindLanding();
    return;
  }
  if(state.mode === 'register'){
    document.getElementById('progress').innerHTML = '';
    card.innerHTML = tplRegister();
    bindRegister();
    return;
  }
  if(state.mode === 'multiDay'){
    document.getElementById('progress').innerHTML = '';
    card.innerHTML = tplMultiDay();
    bindMultiDay();
    return;
  }
  if(state.mode === 'lookupBookings'){
    document.getElementById('progress').innerHTML = '';
    card.innerHTML = tplLookupBookings();
    bindLookupBookings();
    return;
  }
  if(state.mode === 'codeEntry'){
    document.getElementById('progress').innerHTML = '';
    card.innerHTML = tplCodeEntry();
    bindCodeEntry();
    return;
  }
  renderProgress();
  if(state.step===1) card.innerHTML = tplStep1();
  else if(state.step===2) card.innerHTML = tplStep2();
  else if(state.step===3) card.innerHTML = tplStep3();
  else if(state.step===4) card.innerHTML = tplStep4();
  else if(state.step===5) card.innerHTML = tplSuccess();

  if(state.step===1) bindStep1();
  if(state.step===2) bindStep2();
  if(state.step===3) bindStep3();
  if(state.step===4) bindStep4();
}
function renderProgress(){
  const el = document.getElementById('progress');
  if(state.step > STEP_LABELS.length){ el.innerHTML = ''; return; }
  el.innerHTML = STEP_LABELS.map((label,i)=>{
    const n = i+1;
    let cls='step-dot';
    if(n < state.step) cls+=' done clickable';
    else if(n === state.step) cls+=' active';
    return `<div class="${cls}" data-goto="${n}"><div class="step-num">${n < state.step ? '✓' : n}</div><div class="step-label">${label}</div></div>`;
  }).join('');
  el.querySelectorAll('.step-dot.clickable').forEach(d=>{
    d.addEventListener('click', ()=>{ state.step = parseInt(d.dataset.goto,10); render(); });
  });
}

function renderLandingCalGrid(){
  const {year, month} = custView;
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const dateStr = fmtDate(dt);
    const past = isPastDate(dt);
    const closed = isDateFullyClosed(dateStr);
    const fullyBooked = landingAvailability.fullyBookedDates.has(dateStr);
    const extended = availability.extendedDates.has(dateStr);
    const taichung = availability.taichungDates.has(dateStr);
    const disabled = past || closed || fullyBooked;
    const isToday = fmtDate(dt) === fmtDate(today);
    const isSelected = state.landingDate === dateStr;
    let cls = 'cal-cell';
    cls += disabled ? ' disabled' : ' avail';
    if(!disabled && extended) cls += ' extended';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    const tag = taichung ? `<span class="taichung-dot"></span>` : '';
    const hintAddr = landingHints[dateStr];
    const areaHint = (!disabled && hintAddr) ? `<span class="area-hint">${esc(extractDistrictOnly(hintAddr))}</span>` : '';
    const fullLabel = (!past && !closed && fullyBooked) ? `<span class="area-hint">已約滿</span>` : '';
    html += `<div class="${cls}" data-date="${disabled?'':dateStr}"><span>${d}</span>${tag}${areaHint}${fullLabel}</div>`;
  }
  return html;
}
function renderLandingDateInfo(){
  const d = state.landingDate;
  const end = getBusinessEnd(d);
  const hint = landingHints[d];
  const blocked = new Set(landingAvailability.blockedSlotsByDate[d] || []);
  const slots = [];
  for(let t=BUSINESS_START; t<end; t+=30){ slots.push(fmtTime(t)); }
  return `
    <div class="empty-note" style="text-align:left;margin-bottom:16px;">
      <b>${d}</b>　營業時間 09:00–${fmtTime(end)}
      ${hint ? `<br>托比當天已經會到「${esc(extractCityDistrict(hint))}」附近服務，順路預約更好安排喔！` : ''}
    </div>
    <div class="slot-grid" style="margin-bottom:16px;">
      ${slots.map(t=>{
        const taken = blocked.has(t);
        return `<div class="slot${taken?' taken':''}" style="cursor:default;">${t}</div>`;
      }).join('')}
    </div>
    <p class="card-desc" style="margin-bottom:16px;">以上為當天時段大致狀況（灰色為已被占用）；實際可預約時間仍需依選擇的服務內容為準。</p>
  `;

function renderMultiDayCalGrid(){
  const {year, month} = multiDayState.monthView;
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const dateStr = fmtDate(dt);
    const past = isPastDate(dt);
    const closed = isDateFullyClosed(dateStr);
    const extended = availability.extendedDates.has(dateStr);
    const taichung = availability.taichungDates.has(dateStr);
    const fullyBooked = !past && !closed && isDateFullyBookedForDuration(dateStr, multiDayState.service.duration, multiDayState.lookupResult ? multiDayState.lookupResult.address : '');
    const disabled = past || closed || fullyBooked;
    const isToday = fmtDate(dt) === fmtDate(today);
    const isSelected = multiDayState.selectedDates.includes(dateStr);
    let cls = 'cal-cell';
    cls += disabled ? ' disabled' : ' avail';
    if(!disabled && extended) cls += ' extended';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    const tag = taichung ? `<span class="taichung-dot"></span>` : '';
    const fullLabel = fullyBooked ? `<span class="area-hint">已約滿</span>` : '';
    html += `<div class="${cls}" data-date="${disabled?'':dateStr}"><span>${d}</span>${tag}${fullLabel}</div>`;
  }
  return html;
}
function isSlotBlockedByTravelForDate(date, startMin, durationMin){
  const info = multiDayState.travelByDate[date];
  if(!info || !info.loaded) return false;
  for(const range of info.blockedRanges){
    if(startMin < range[1] && (startMin+durationMin) > range[0]) return true;
  }
  return false;
}
async function loadMultiDayTravelForDate(date){
  multiDayState.travelByDate[date] = { loaded:false, blockedRanges:[] };
  if(!GOOGLE_SCRIPT_URL){ multiDayState.travelByDate[date] = { loaded:true, blockedRanges:[] }; return; }
  try{
    const addr = multiDayState.lookupResult ? multiDayState.lookupResult.address : '';
    const res = await fetch(GOOGLE_SCRIPT_URL + '?action=getTravelBlockedSlots&date=' + encodeURIComponent(date) + '&address=' + encodeURIComponent(addr));
    const data = await res.json();
    multiDayState.travelByDate[date] = { loaded:true, blockedRanges: (data.success && data.blockedRanges) ? data.blockedRanges : [] };
  }catch(err){
    multiDayState.travelByDate[date] = { loaded:true, blockedRanges: [] };
  }
}
function renderMultiDayDateList(){
  if(multiDayState.selectedDates.length===0){ return `<div class="empty-note">請先在上方日曆點選想預約的日期（可點多個）。</div>`; }
  return multiDayState.selectedDates.map(date=>{
    const info = multiDayState.travelByDate[date];
    const time = multiDayState.timesByDate[date];
    let slotHtml;
    if(!info || !info.loaded){
      slotHtml = `<div class="empty-note">讀取可預約時段中...</div>`;
    } else {
      const duration = multiDayState.service.duration;
      const end = getBusinessEnd(date);
      const slots = [];
      for(let start=BUSINESS_START; start+duration<=end; start+=30){
        const addr = multiDayState.lookupResult ? multiDayState.lookupResult.address : '';
        const taken = isSlotBlocked(date, start, duration) || isSlotBlockedByTravelForDate(date, start, duration) || !isSlotAllowedForRegion(date, start, duration, addr);
        slots.push({ start, taken });
      }
      slotHtml = slots.length===0 ? `<div class="empty-note">此服務所需時間較長，當日時段不足，請移除此日期。</div>` : `
        <div class="slot-grid">
          ${slots.map(s=>{
            const val = fmtTime(s.start);
            const isSel = time===val;
            let cls = 'slot';
            if(s.taken) cls += ' taken'; else if(isSel) cls += ' selected';
            return `<div class="${cls}" data-date="${date}" data-time="${s.taken?'':val}">${val}</div>`;
          }).join('')}
        </div>
      `;
    }
    return `
      <div class="review-block">
        <h4 style="display:flex;justify-content:space-between;align-items:center;">
          <span>${date}${time?`　已選 ${time}`:''}</span>
          <button data-remove-date="${date}" style="color:var(--danger);background:none;border:none;font-weight:700;cursor:pointer;font-size:12px;">移除</button>
        </h4>
        ${slotHtml}
      </div>
    `;
  }).join('');
}

function bindMultiDayDates(){
  document.getElementById('mdBackToService').addEventListener('click', ()=>{ multiDayState.step='service'; render(); });
  document.getElementById('md-cal-prev').addEventListener('click', ()=>{ multiDayState.monthView.month--; if(multiDayState.monthView.month<0){multiDayState.monthView.month=11; multiDayState.monthView.year--;} render(); });
  document.getElementById('md-cal-next').addEventListener('click', ()=>{ multiDayState.monthView.month++; if(multiDayState.monthView.month>11){multiDayState.monthView.month=0; multiDayState.monthView.year++;} render(); });
  document.getElementById('md-cal-grid').addEventListener('click', e=>{
    const c = e.target.closest('.cal-cell.avail'); if(!c) return;
    const date = c.dataset.date;
    if(multiDayState.selectedDates.includes(date)) return;
    multiDayState.selectedDates.push(date);
    render();
    loadMultiDayTravelForDate(date).then(()=>{ if(multiDayState.step==='dates') render(); });
  });
  document.getElementById('md-date-list').addEventListener('click', e=>{
    const rem = e.target.closest('[data-remove-date]');
    if(rem){
      const date = rem.dataset.removeDate;
      multiDayState.selectedDates = multiDayState.selectedDates.filter(d=>d!==date);
      delete multiDayState.timesByDate[date];
      delete multiDayState.travelByDate[date];
      render();
      return;
    }

function bindLookupBookings(){
  if(rescheduleState.active){ bindReschedule(); return; }
  document.getElementById('lbBackLanding').addEventListener('click', ()=>{ state.mode='landing'; resetLookupBookingsState(); render(); });
  document.getElementById('lbSearchBtn').addEventListener('click', async ()=>{
    const code = document.getElementById('lb-code').value.trim();
    const errEl = document.getElementById('lb-err');
    errEl.style.display = 'none';
    if(!code){ errEl.textContent='請輸入代碼。'; errEl.style.display='block'; return; }
    lookupBookingsState.code = code;
    if(!GOOGLE_SCRIPT_URL){ errEl.textContent='目前尚未連結試算表，無法查詢。'; errEl.style.display='block'; return; }
    const btn = document.getElementById('lbSearchBtn');
    btn.disabled = true; btn.textContent = '查詢中...';
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL + '?action=getBookingsByCode&code=' + encodeURIComponent(code));
      const data = await res.json();
      if(!data.success) throw new Error(data.error || '查無資料');
      lookupBookingsState.customer = data.customer;
      lookupBookingsState.bookings = data.bookings || [];
      render();
    }catch(err){
      btn.disabled = false; btn.textContent = '查詢';
      errEl.textContent = '查無此代碼的預約記錄，請確認代碼是否正確。';
      errEl.style.display = 'block';
    }
  });
  document.querySelectorAll('[data-reschedule]').forEach(el=>{
    el.addEventListener('click', ()=>{
      resetRescheduleState();
      rescheduleState.active = true;
      rescheduleState.confirmCode = el.dataset.reschedule;
      rescheduleState.duration = parseInt(el.dataset.duration, 10);
      rescheduleState.oldDate = el.dataset.oldDate;
      rescheduleState.oldTime = el.dataset.oldTime;
      render();
    });
  });
  const downloadBtn = document.getElementById('lbDownloadBtn');
  if(downloadBtn){
    downloadBtn.addEventListener('click', async ()=>{
      const el = document.getElementById('lb-export-area');
      if(!el || typeof html2canvas === 'undefined') return;
      downloadBtn.disabled = true; downloadBtn.textContent = '產生圖片中...';
      // 截圖前先把「修改時段」這類不需要出現在匯出圖片裡的元素暫時藏起來，截完再還原，不影響畫面上原本的操作
      const hideEls = Array.from(el.querySelectorAll('.no-export'));
      const prevDisplay = hideEls.map(n=>n.style.display);
      hideEls.forEach(n=>{ n.style.display = 'none'; });
      try{
        const canvas = await html2canvas(el, { backgroundColor:'#FFFFFF', scale:2 });
        hideEls.forEach((n,i)=>{ n.style.display = prevDisplay[i]; });
        const name = (lookupBookingsState.customer && lookupBookingsState.customer.ownerName) ? lookupBookingsState.customer.ownerName : '預約記錄';
        const filename = name + '_預約記錄.png';

        canvas.toBlob(async (blob)=>{
          if(!blob){ downloadBtn.disabled=false; downloadBtn.textContent='下載記錄圖片'; return; }
          const file = new File([blob], filename, { type:'image/png' });

          if(navigator.canShare && navigator.canShare({ files:[file] })){
            try{
              await navigator.share({ files:[file], title:filename });
            }catch(shareErr){
              if(shareErr.name !== 'AbortError'){ openImageFallback(canvas.toDataURL('image/png')); }
            }
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(()=>URL.revokeObjectURL(url), 2000);
            // 部分手機瀏覽器不支援 download 屬性，額外開一個分頁保底，讓使用者可以長按儲存
            openImageFallback(canvas.toDataURL('image/png'));
          }
          downloadBtn.disabled = false; downloadBtn.textContent = '下載記錄圖片';
        }, 'image/png');
      }catch(err){
        console.error('產生圖片失敗：', err);
        hideEls.forEach((n,i)=>{ n.style.display = prevDisplay[i]; });
        downloadBtn.disabled = false; downloadBtn.textContent = '下載記錄圖片';
      }
    });
  }
}
function openImageFallback(dataUrl){
  try{
    const win = window.open();
    if(win){
      win.document.write('<title>長按圖片即可儲存</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+dataUrl+'" style="max-width:100%;height:auto;"></body>');
    }
  }catch(err){ console.error('開啟圖片失敗：', err); }
}

/* ================= 修改預約時段（僅限未來的預約） ================= */
function renderRescheduleCalGrid(){
  const {year, month} = rescheduleState.monthView;
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const dateStr = fmtDate(dt);
    const past = isPastDate(dt);
    const closed = isDateFullyClosed(dateStr);
    const extended = availability.extendedDates.has(dateStr);
    const taichung = availability.taichungDates.has(dateStr);
    const fullyBooked = !past && !closed && isDateFullyBookedForDuration(dateStr, rescheduleState.duration, lookupBookingsState.customer ? lookupBookingsState.customer.address : '');
    const disabled = past || closed || fullyBooked;
    const isToday = fmtDate(dt) === fmtDate(today);
    const isSelected = rescheduleState.date === dateStr;
    let cls = 'cal-cell';
    cls += disabled ? ' disabled' : ' avail';
    if(!disabled && extended) cls += ' extended';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    const tag = taichung ? `<span class="taichung-dot"></span>` : '';
    const fullLabel = fullyBooked ? `<span class="area-hint">已約滿</span>` : '';
    html += `<div class="${cls}" data-date="${disabled?'':dateStr}"><span>${d}</span>${tag}${fullLabel}</div>`;
  }
  return html;
}
function isSlotBlockedByRescheduleTravel(startMin, durationMin){
  if(!rescheduleState.travelLoaded) return false;
  for(const range of rescheduleState.travelBlockedRanges){
    if(startMin < range[1] && (startMin+durationMin) > range[0]) return true;
  }
  return false;
}
async function loadRescheduleTravel(date){
  rescheduleState.travelLoaded = false;
  if(!GOOGLE_SCRIPT_URL){ rescheduleState.travelBlockedRanges=[]; rescheduleState.travelLoaded=true; return; }
  try{
    const addr = lookupBookingsState.customer ? lookupBookingsState.customer.address : '';
    const res = await fetch(GOOGLE_SCRIPT_URL + '?action=getTravelBlockedSlots&date=' + encodeURIComponent(date) + '&address=' + encodeURIComponent(addr) + '&excludeCode=' + encodeURIComponent(rescheduleState.confirmCode));
    const data = await res.json();
    rescheduleState.travelBlockedRanges = (data.success && data.blockedRanges) ? data.blockedRanges : [];
  }catch(err){ rescheduleState.travelBlockedRanges = []; }
  rescheduleState.travelLoaded = true;
}
function renderRescheduleSlotSection(){
  if(!rescheduleState.date){ return `<div class="empty-note">請先選擇日期，即可查看可預約時段。</div>`; }
  if(!rescheduleState.travelLoaded){ return `<div class="empty-note">檢查行程時間中...</div>`; }
  const duration = rescheduleState.duration || 60;
  const end = getBusinessEnd(rescheduleState.date);
  const slots = [];
  for(let start=BUSINESS_START; start+duration<=end; start+=30){
    const addr = lookupBookingsState.customer ? lookupBookingsState.customer.address : '';
    const taken = isSlotBlocked(rescheduleState.date, start, duration) || isSlotBlockedByRescheduleTravel(start, duration) || !isSlotAllowedForRegion(rescheduleState.date, start, duration, addr);
    slots.push({ start, taken });
  }
  if(slots.length===0){ return `<div class="empty-note">此服務所需時間較長，當日時段不足，請選擇其他日期。</div>`; }
  return `
    <div class="slot-title">${rescheduleState.date} 可預約時段</div>
    <div class="slot-grid" id="rs-slot-grid">
      ${slots.map(s=>{
        const val = fmtTime(s.start);
        const isSel = rescheduleState.time === val;
        let cls = 'slot';
        if(s.taken) cls += ' taken'; else if(isSel) cls += ' selected';
        return `<div class="${cls}" data-time="${s.taken?'':val}">${val}</div>`;
      }).join('')}
    </div>
  `;
}

function bindReschedule(){
  document.getElementById('rsCancel').addEventListener('click', ()=>{ resetRescheduleState(); render(); });
  document.getElementById('rs-cal-prev').addEventListener('click', ()=>{ rescheduleState.monthView.month--; if(rescheduleState.monthView.month<0){rescheduleState.monthView.month=11; rescheduleState.monthView.year--;} rescheduleState.date=null; rescheduleState.time=null; render(); });

      action:'rescheduleBooking', confirmCode: rs.confirmCode,

      newDate: rs.date, newTime: rs.time, newEndTime: fmtTime(toMin(rs.time)+rs.duration)
    };
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
      });

      resetRescheduleState();
      await refreshLookupBookings();
      render();
    }catch(err){
      btn.disabled = false; btn.textContent = '確認改期';
      errEl.textContent = err.message || '修改失敗，請確認網路連線後再試一次。';
      errEl.style.display = 'block';

async function refreshLookupBookings(){

function renderCustCalGrid(){
  const {year, month} = custView;
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const dateStr = fmtDate(dt);
    const past = isPastDate(dt);
    const closed = isDateFullyClosed(dateStr);
    const extended = availability.extendedDates.has(dateStr);
    const taichung = availability.taichungDates.has(dateStr);
    const fullyBooked = !past && !closed && isDateFullyBookedForDuration(dateStr, state.service.duration, state.owner.address);
    const disabled = past || closed || fullyBooked;
    const isToday = fmtDate(dt) === fmtDate(today);
    const isSelected = state.booking.date === dateStr;
    let cls = 'cal-cell';
    cls += disabled ? ' disabled' : ' avail';
    if(!disabled && extended) cls += ' extended';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    const tag = taichung ? `<span class="taichung-dot"></span>` : '';
    const fullLabel = fullyBooked ? `<span class="area-hint">已約滿</span>` : '';
    html += `<div class="${cls}" data-date="${disabled?'':dateStr}"><span>${d}</span>${tag}${fullLabel}</div>`;
  }
  return html;
}
function renderSlotSection(){
  if(!availability.loaded){ return `<div class="empty-note">讀取可預約時段中...</div>`; }
  if(!state.booking.date){ return `<div class="empty-note">請先選擇日期，即可查看可預約時段。</div>`; }
  if(travelState.forDate !== state.booking.date || !travelState.loaded){ return `<div class="empty-note">讀取當日預約狀況中...</div>`; }
  const duration = state.service.duration || 120;
  const end = getBusinessEnd(state.booking.date);
  const slots = [];
  for(let start=BUSINESS_START; start+duration<=end; start+=30){
    const taken = isSlotBlocked(state.booking.date, start, duration) || isSlotBlockedByTravel(start, duration) || !isSlotAllowedForRegion(state.booking.date, start, duration, state.owner.address);
    slots.push({ start, taken });
  }
  if(slots.length===0){ return `<div class="empty-note">此服務所需時間較長，當日時段不足，請選擇其他日期。</div>`; }
  return `
    <div class="slot-title">${state.booking.date} 可預約時段</div>
    <div class="slot-grid" id="slot-grid">
      ${slots.map(s=>{
        const val = fmtTime(s.start);
        const isSel = state.booking.time === val;
        let cls = 'slot';
        if(s.taken) cls += ' taken'; else if(isSel) cls += ' selected';
        return `<div class="${cls}" data-time="${s.taken?'':val}">${val}</div>`;
      }).join('')}
    </div>
  `;
}

    slots.push({ start, taken });
  }
  if(slots.length===0){ return `<div class="empty-note">此服務所需時間較長，當日時段不足，請選擇其他日期。</div>`; }
  return `
    <div class="slot-title">${state.booking.date} 可預約時段</div>
    ${travelState.error ? `<div class="empty-note" style="margin-bottom:10px;">${travelState.error}</div>` : ''}
    <div class="slot-grid" id="slot-grid">
      ${slots.map(s=>{
        const val = fmtTime(s.start);
        const isSel = state.booking.time === val;
        let cls = 'slot';
        if(s.taken) cls += ' taken'; else if(isSel) cls += ' selected';
        return `<div class="${cls}" data-time="${s.taken?'':val}">${val}</div>`;
      }).join('')}
    </div>
  `;
}
function bindStep3(){
  document.getElementById('cal-grid').addEventListener('click', e=>{
    const c = e.target.closest('.cal-cell.avail'); if(!c) return;
    state.booking.date = c.dataset.date; state.booking.time = null;
    render();
    loadTravelBlockedSlots(state.booking.date).then(()=>{ if(state.step===3) render(); });
  });
  const slotGrid = document.getElementById('slot-grid');
  if(slotGrid){
    slotGrid.addEventListener('click', e=>{
      const s = e.target.closest('.slot'); if(!s || s.classList.contains('taken')) return;
      state.booking.time = s.dataset.time;
      render();
    });
  }
  document.getElementById('cal-prev').addEventListener('click', ()=>{ custView.month--; if(custView.month<0){custView.month=11; custView.year--;} state.booking.date=null; state.booking.time=null; render(); });
  document.getElementById('cal-next').addEventListener('click', ()=>{ custView.month++; if(custView.month>11){custView.month=0; custView.year++;} state.booking.date=null; state.booking.time=null; render(); });
  document.getElementById('back3').addEventListener('click', ()=>{ state.step=2; render(); });
  document.getElementById('next3').addEventListener('click', ()=>{
    const errEl = document.getElementById('step3-err');
    if(!state.booking.date || !state.booking.time){ errEl.textContent = '請選擇預約日期與時段。'; errEl.style.display='block'; return; }
    const duration = state.service.duration || 120;
    const startMin = toMin(state.booking.time);
    const stillOk = !isSlotBlocked(state.booking.date, startMin, duration)
      && !isSlotBlockedByTravel(startMin, duration)
      && isSlotAllowedForRegion(state.booking.date, startMin, duration, state.owner.address);
    if(!stillOk){
      state.booking.time = null;
      errEl.textContent = '這個時段依你留的地址判斷目前不能預約，請重新選擇其他時段。';
      errEl.style.display = 'block';
      render();
      return;
    }
    errEl.style.display = 'none';
    state.step = 4; render();
  });
  if(state.booking.date && travelState.forDate !== state.booking.date && !travelState.loading){
    loadTravelBlockedSlots(state.booking.date).then(()=>{ if(state.step===3) render(); });
  }
}

/* ================= STEP 4：確認預約 ================= */
function tplStep4(){
  const o = state.owner, s = state.service, b = state.booking;
  const hrs = s.duration/60;
  return `
    <h2 class="card-title">確認預約資訊</h2>
    <p class="card-desc">請確認以下資訊無誤後送出預約。</p>
    ${o.petPhoto ? `<div class="review-photo"><img src="${o.petPhoto}"><div><div style="font-weight:700;color:var(--pine);">${esc(o.petName)}</div><div style="font-size:12px;color:var(--ink-soft);">${esc(o.petBreed)}</div></div></div>` : ''}
    <div class="review-block">
      <h4>飼主資訊</h4>
      <div class="review-line"><span class="k">姓名</span><span class="v">${esc(o.name)}</span></div>
      <div class="review-line"><span class="k">電話</span><span class="v">${esc(o.phone)}</span></div>
      <div class="review-line"><span class="k">LINE ID</span><span class="v">${esc(o.lineId)||'—'}</span></div>
      <div class="review-line"><span class="k">地址</span><span class="v">${esc(o.address)}</span></div>
    </div>
    <div class="review-block">
      <h4>毛孩資訊</h4>
      <div class="review-line"><span class="k">名稱</span><span class="v">${esc(o.petName)}</span></div>
      <div class="review-line"><span class="k">品種</span><span class="v">${esc(o.petBreed)}</span></div>
      <div class="review-line"><span class="k">年齡</span><span class="v">${esc(o.petAge)||'—'} 歲</span></div>
      <div class="review-line"><span class="k">體重</span><span class="v">${esc(o.petWeight)||'—'} kg</span></div>
      <div class="review-line"><span class="k">個性</span><span class="v multi">${esc(o.petPersonality)||'—'}</span></div>
      <div class="review-line"><span class="k">健康狀況</span><span class="v multi">${esc(o.petHealth)||'—'}</span></div>
    </div>
    <div class="review-block">
      <h4>服務內容</h4>
      <div class="review-line"><span class="k">服務項目</span><span class="v">${s.label}</span></div>
      <div class="review-line"><span class="k">預估時間</span><span class="v">${hrs % 1===0?hrs:hrs.toFixed(1)} 小時</span></div>
      <div class="review-line"><span class="k">預約日期</span><span class="v">${b.date}</span></div>
      <div class="review-line"><span class="k">預約時段</span><span class="v">${b.time} – ${fmtTime(toMin(b.time)+s.duration)}</span></div>
    </div>
    <div class="err" id="step4-err" style="display:none;"></div>
    <div class="actions"><button class="btn btn-ghost" id="back4">上一步</button><button class="btn btn-primary" id="submit4">送出預約</button></div>
  `;
}
function bindStep4(){
  document.getElementById('back4').addEventListener('click', ()=>{ state.step=3; render(); });
  document.getElementById('submit4').addEventListener('click', async ()=>{
    const btn = document.getElementById('submit4');
    const errEl = document.getElementById('step4-err');
    errEl.style.display = 'none';
    const code = genCode();
    const o = state.owner, s = state.service, b = state.booking;
    const payload = {
      action:'booking', customerCode: o.customerCode || undefined,
      confirmCode: code, ownerName: o.name, phone: o.phone, lineId: o.lineId, address: o.address,
      petName: o.petName, petBreed: o.petBreed, petAge: o.petAge, petWeight: o.petWeight,
      petPersonality: o.petPersonality, petHealth: o.petHealth, petPhoto: o.petPhoto || '', serviceLabel: s.label, durationMinutes: s.duration,
      date: b.date, time: b.time, endTime: fmtTime(toMin(b.time) + s.duration), taichung: availability.taichungDates.has(b.date)
    };
    if(!GOOGLE_SCRIPT_URL){ state.confirmCode = code; state.customerCode = null; state.step = 5; render(); return; }
    btn.disabled = true; btn.textContent = '送出中...';
    try{
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
      });
      const result = await res.json();
      if(!result.success) throw new Error(result.error || '寫入失敗');
      state.confirmCode = code;
      state.customerCode = result.customerCode || null;
      state.step = 5; render();
    }catch(err){
      btn.disabled = false; btn.textContent = '送出預約';
      errEl.textContent = '預約資料傳送失敗，請確認網路連線後再試一次。（' + err.message + '）';
      errEl.style.display = 'block';
      console.error('送出預約失敗：', err);
    }
  });
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='PB-'; for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

/* ================= STEP 5：成功頁 ================= */
function tplSuccess(){
  const b = state.booking, o = state.owner;
  return `
    <div class="success">
      <div class="paw">${svgPaw()}</div>
      <h2>預約已送出</h2>
      <div class="pending-badge">⏳ 需等托比確認</div>
      <p>已為 ${esc(o.petName)} 送出 ${b.date} ${b.time} 的${state.service.label}預約，<br>托比確認後會透過您留下的聯絡方式通知您。</p>
      ${state.customerCode ? `
      <div class="code-box">
        <div class="lbl">您的專屬代碼</div>
        <div class="code">${esc(state.customerCode)}</div>
        <div class="tip">請截圖保存，下次預約時輸入這組代碼，就能自動帶入您與毛孩的資料，不用重新填寫。</div>
      </div>
      ` : ''}
    </div>
    <div class="actions"><button class="btn btn-primary" id="newBooking" style="flex:1;">建立新預約</button></div>
  `;
}
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='newBooking'){
    state.mode = 'landing';
    state.step = 1;
    state.landingDate = null;
    state.owner = {name:'',phone:'',lineId:'',address:'',petName:'',petBreed:'',petAge:'',petWeight:'',petPersonality:'',petHealth:'',petPhoto:null};
    state.service = {category:'',animalType:'',hairLength:'',duration:0,label:''};
    state.booking = {date:null,time:null};
    state.identifyMode = 'new';
    state.lookupCode = ''; state.lookupResult = null;
    state.confirmCode = null; state.customerCode = null;
    travelState.loaded = false; travelState.loading = false; travelState.blockedRanges = []; travelState.forDate = null; travelState.error = '';
    render();
    loadAreaHints();
    loadLandingAvailability();
  }
});

render();
loadAvailability().then(()=>{ render(); });
loadAreaHints().then(()=>{ if(state.mode==='landing') render(); });
loadLandingAvailability().then(()=>{ if(state.mode==='landing') render(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ================= 加入主畫面提示條 ================= */
let deferredInstallPrompt = null;
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function showInstallBanner(mode){
  if(isStandalone() || document.getElementById('installBanner')) return;
  const wrap = document.querySelector('.wrap');
  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.className = 'install-banner';
  if(mode==='android'){
    banner.innerHTML = `<span>加入主畫面，像 App 一樣使用</span><span class="btns"><button class="install-go" id="installGoBtn">安裝</button><button class="install-close" id="installCloseBtn">✕</button></span>`;
  } else {
    banner.innerHTML = `<span>iPhone 用戶：點下方 <b>分享</b> 圖示 → <b>加入主畫面</b></span><span class="btns"><button class="install-close" id="installCloseBtn">✕</button></span>`;
  }
  wrap.insertBefore(banner, wrap.firstChild);
  document.getElementById('installCloseBtn').addEventListener('click', ()=>banner.remove());
  const goBtn = document.getElementById('installGoBtn');
  if(goBtn){
    goBtn.addEventListener('click', async ()=>{
      banner.remove();
      if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; }
    });
  }
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});
window.addEventListener('load', ()=>{
  if(!isStandalone() && isIOS()){ setTimeout(()=>showInstallBanner('ios'), 1000); }
});
</script>
